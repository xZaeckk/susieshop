<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SusieShop Checkout</title>

    <link rel="stylesheet" href="checkout.css">
</head>
<body>

<div class="checkout-container">

    <h1>Checkout</h1>

    <label>Minecraft Name</label>
    <input id="minecraftName" type="text" placeholder="Enter your Minecraft name">

    <label>Email (Optional)</label>
    <input id="email" type="email" placeholder="Receipt email">

    <label>Platform</label>
    <select id="platform">
        <option>Java Edition</option>
        <option>Bedrock Edition</option>
    </select>

    <label>Gamemode</label>
    <select id="gamemode">
        <option>SusieSMP</option>
    </select>

    <label>Rank</label>
    <select id="rank">
        <option>Kimbab</option>
        <option>Salmon</option>
        <option>Susie</option>
        <option>Wasabi</option>
    </select>

    <label>Product</label>
    <input id="product" type="text" readonly>

    <label>Price</label>
    <input id="price" type="text" readonly>

    <button id="submitPurchase">Submit Purchase</button>

</div>

<script src="checkout.js"></script>

</body>
</html>
